name: CoreMLDemo
options:
  bundleIdPrefix: ru.study
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  CoreMLDemo:
    type: application
    platform: iOS
    sources:
      - path: CoreMLDemo
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ru.study.CoreMLDemo
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: ML Vision
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: Выберите изображение для классификации на устройстве.
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
    scheme:
      testTargets:
        - CoreMLDemoTests
  CoreMLDemoTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: CoreMLDemoTests
    dependencies:
      - target: CoreMLDemo
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: ru.study.CoreMLDemoTests
